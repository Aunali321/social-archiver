# ARCHIVE_ROOT is the host directory holding the archive. Leave it unset to use the compose
# file's own directory; on a NAS point it at the dataset, e.g.
#   ARCHIVE_ROOT=/mnt/tank/social-archiver
# downloads/ is the archive itself and must stay a volume: with CLEANUP_DOWNLOADS=false
# nothing is ever deleted, so an unmounted downloads/ would sit in the container's writable
# layer and be lost on the next rebuild.
#
# One service, not one per platform: the scheduler and the web UI both enqueue, and a single
# worker per platform drains that queue, so nothing can run the same platform twice at once.
services:
  social-archiver:
    image: ghcr.io/aunali321/social-archiver:latest
    # build: .  # Uncomment to build locally instead
    container_name: social-archiver
    restart: unless-stopped
    env_file: .env
    ports:
      - "8787:8080"
    volumes:
      - ${ARCHIVE_ROOT:-.}/data:/data
      - ${ARCHIVE_ROOT:-.}/downloads:/downloads
      - ${ARCHIVE_ROOT:-.}/logs:/logs
